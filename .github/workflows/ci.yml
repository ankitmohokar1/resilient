name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The go directive names the minimum; testing the two most recent releases catches both
        # accidental use of newer APIs and breakage from toolchain changes.
        go: ['1.22', '1.23']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector is the real assertion in the concurrency tests. A RoundTripper is called
      # from many goroutines at once, so running without -race would let a genuine data race pass.
      - name: Test with the race detector
        run: go test -race -count=1 ./...

      - name: Coverage
        run: go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1

  lint:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
